<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"

<title>ねこの相棒とふしぎの島</title>
<link rel="stylesheet" href="css/style.css" />

<!-- ===== パスワードのとびら（かんたんな目隠し） ===== -->
<div id="gate" class="overlay">
  <div class="gate-box">
    <div class="gate-title">🐱 ねこの相棒とふしぎの島</div>

    <!-- あいことば入力（未認証時） -->
    <div id="gate-auth-area">
      <div class="gate-sub">あいことばを入れてね</div>
      <input id="gate-input" type="password" inputmode="text" autocomplete="off" placeholder="あいことば" />
      <button id="gate-btn">スタート</button>
      <div id="gate-error" class="gate-error"></div>
    </div>

    <!-- 面選択＆スタートメニュー（認証後） -->
    <div id="gate-menu-area" class="hidden">
      <!-- つづきから（セーブがあるとき） -->
      <button id="gate-continue" class="gate-main-btn hidden">つづきから</button>

      <!-- 面をえらんで はじめる -->
      <div class="gate-stage-box">
        <label for="gate-stage-select" class="gate-stage-label">はじめる面を えらぶ：</label>
        <select id="gate-stage-select" class="gate-stage-select"></select>
        <button id="gate-start-stage" class="gate-stage-btn">この面から はじめる</button>
      </div>

      <!-- エディタ編集マップ自動適用の通知 -->
      <div id="gate-editor-badge" class="gate-editor-badge hidden">
        <span>🛠️ エディタの編集マップを自動反映中</span>
        <button id="gate-editor-reset" class="gate-editor-reset" title="もとのマップにもどす">元にもどす</button>
      </div>

      <button id="gate-new" class="gate-sub-btn">さいしょから やりなおす（1面）</button>
    </div>
  </div>
</div>

<!-- ===== ゲーム画面（固定サイズ・中央ぞろえ） ===== -->
<div id="stage">
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- エディタ更新のリアルタイム通知 -->
    <div id="map-sync-toast" class="hidden"></div>

    <!-- あそびかたの小さなヒント -->
    <div id="hint">うごく：ボタン／WASD　・　🗡️ボタン／Jキー：けんを ふる　・　はなしを すすめる：タップ／スペース</div>

    <!-- かいわのウィンドウ -->
    <div id="dialogue" class="hidden">
      <div id="dialogue-name"></div>
      <div id="dialogue-text"></div>
      <div id="dialogue-choices" class="dialogue-choices hidden"></div>
      <div class="dialogue-more">▼ タップでつぎへ</div>
    </div>

    <!-- バーチャルジョイスティック（上下左右・斜めに指で動かせるスライドパッド） -->
    <div id="joystick" class="joystick-container" aria-label="いどうパッド">
      <div class="joystick-base">
        <span class="joystick-arrow up">▲</span>
        <span class="joystick-arrow left">◀</span>
        <span class="joystick-arrow right">▶</span>
        <span class="joystick-arrow down">▼</span>
        <div class="joystick-knob"></div>
      </div>
    </div>

    <!-- けん・ぶき（こうげき）。もっている ものだけ ここに ふえる -->
    <div id="actions">
      <button id="btn-sword" class="abtn" aria-label="ぶき">🗡️</button>
      <button id="btn-weapon-swap" class="abtn small hidden" aria-label="ぶききりかえ" title="ぶきを きりかえる">🔁</button>
      <button id="btn-hint" class="abtn small hidden" aria-label="ヒント">💡</button>
    </div>

    <!-- タイトルへ・おたすけ・おんがくボタン（右上） -->
    <button id="btn-sound" class="cornerbtn" aria-label="おんがく" title="BGMの オン／オフ">🎵</button>
    <button id="btn-title" class="cornerbtn" aria-label="タイトルへ" title="タイトルへ もどる">🏠</button>
    <button id="btn-help" class="cornerbtn" aria-label="おたすけ" title="おたすけモード">🆘</button>
  </div>
</div>
