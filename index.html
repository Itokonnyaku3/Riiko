<meta charset="utf-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>
<title>ねこの相棒とふしぎの島</title>
<link rel="stylesheet" href="css/style.css" />

<!-- ===== パスワードのとびら（かんたんな目隠し） ===== -->
<div id="gate" class="overlay">
  <div class="gate-box">
    <div class="gate-title">🐱 ねこの相棒とふしぎの島</div>
    <div class="gate-sub">あいことばを入れてね</div>
    <input id="gate-input" type="password" inputmode="text" autocomplete="off" placeholder="あいことば" />
    <button id="gate-btn">スタート</button>
    <div id="gate-error" class="gate-error"></div>
  </div>
</div>

<!-- ===== ゲーム画面（固定サイズ・中央ぞろえ） ===== -->
<div id="stage">
  <div id="game-container">
    <canvas id="game"></canvas>

    <!-- あそびかたの小さなヒント -->
    <div id="hint">うごく：ボタン／WASD　・　🗡️ボタン／Jキー：けんを ふる　・　てきをタップ：ねこが たたかう</div>

    <!-- かいわのウィンドウ -->
    <div id="dialogue" class="hidden">
      <div id="dialogue-name"></div>
      <div id="dialogue-text"></div>
      <div class="dialogue-more">▼ タップでつぎへ</div>
    </div>

    <!-- ほうこうボタン（バーチャルキー） -->
    <div id="dpad">
      <button class="dbtn up" data-dir="ArrowUp" aria-label="うえ">▲</button>
      <button class="dbtn left" data-dir="ArrowLeft" aria-label="ひだり">◀</button>
      <button class="dbtn right" data-dir="ArrowRight" aria-label="みぎ">▶</button>
      <button class="dbtn down" data-dir="ArrowDown" aria-label="した">▼</button>
    </div>

    <!-- けん（こうげき）。もっている ものだけ ここに ふえる -->
    <div id="actions">
      <button id="btn-sword" class="abtn" aria-label="けん">🗡️</button>
    </div>
  </div>
</div>

<script src="js/mapdata.js?v=10"></script>
<!-- できあがっている マップ（ふえたら ここに ふやす） -->
<script src="js/maps/stage1.js?v=10"></script>
<script src="js/scenario.js?v=10"></script>
<script src="js/engine.js?v=10"></script>
<script src="js/main.js?v=10"></script>
